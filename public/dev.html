<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red &amp; Black — Game Inspector</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="dev.css">
</head>
<body class="dev">

<header class="topbar">
  <div class="brand"><span class="brand-red">RED</span> &amp; <span class="brand-black">BLACK</span></div>
  <span class="dev-tag">Inspector</span>
  <div class="meta">
    <a href="/" class="link">← back to game</a>
  </div>
</header>

<div class="dev-wrap">
  <!-- game index -->
  <aside class="dev-list">
    <div class="dev-list-head">
      <h2>Games</h2>
      <button class="ghost small" id="reloadBtn">Reload</button>
    </div>
    <ul id="games"></ul>
  </aside>

  <!-- detail -->
  <main class="dev-detail" id="detail">
    <div class="placeholder">Select a game to inspect its full record.</div>
  </main>
</div>

<!-- Client errors — frontend failures reported live by the browser.
     See CLAUDE.md standard #4: a toast fading after a few seconds is not a
     reporting mechanism. This is. -->
<div class="dev-wrap" style="margin-top:0">
  <div class="dev-list" style="grid-column: 1 / -1; position: static; max-height: none;">
    <div class="dev-list-head">
      <h2>Client errors <span class="pill" id="ceCount">0</span></h2>
      <button class="ghost small" id="ceReload">Reload</button>
    </div>
    <div id="clientErrors" style="overflow-x:auto"></div>
  </div>
</div>

<script src="dev.js"></script>
</body>
</html>
